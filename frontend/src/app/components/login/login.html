<div style="max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>CNI Secure Transfer - Login</h2>
  
  <div *ngIf="errorMessage" style="color: red; margin-bottom: 10px;">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onLogin()">
    <div style="margin-bottom: 15px;">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" name="username" required style="width: 100%; padding: 8px; margin-top: 5px;" />
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;" />
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Login
    </button>
  </form>
</div>

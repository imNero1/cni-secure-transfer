<div style="max-width: 900px; margin: 40px auto; font-family: sans-serif;">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px;">
    <h2>CNI Secure File Transfer Dashboard</h2>
    <button (click)="logout()" style="padding: 8px 16px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Logout
    </button>
  </div>

  <!-- Upload Section -->
  <div style="margin-top: 30px; padding: 20px; border: 1px dashed #007bff; background-color: #f8f9fa; border-radius: 6px;">
    <h3>Encrypted File Upload</h3>
    
    <div style="margin-bottom: 15px;">
      <label>Select File (.xlsx, .pdf, etc.):</label><br />
      <input type="file" (change)="onFileSelected($event)" style="margin-top: 8px;" />
    </div>

    <div style="margin-bottom: 15px;">
      <label>Recipient Identifier:</label>
      <input type="text" [(ngModel)]="recipient" placeholder="e.g. user@cni.tn" style="width: 100%; padding: 8px; margin-top: 5px;" />
    </div>

    <button (click)="onUpload()" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Encrypt & Transfer File
    </button>

    <div *ngIf="statusMessage" style="margin-top: 15px; font-weight: bold; color: #333;">
      {{ statusMessage }}
    </div>
  </div>

  <!-- Audit Logs Section -->
  <div style="margin-top: 40px;">
    <h3>PostgreSQL Audit Logs</h3>
    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;" border="1" cellpadding="8">
      <thead>
        <tr style="background-color: #f2f2f2;">
          <th>ID</th>
          <th>Filename</th>
          <th>Sender</th>
          <th>Recipient</th>
          <th>Timestamp</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logs">
          <td>{{ log.id }}</td>
          <td>{{ log.filename }}</td>
          <td>{{ log.sender }}</td>
          <td>{{ log.recipient }}</td>
          <td>{{ log.timestamp }}</td>
          <td>{{ log.status }}</td>
        </tr>
        <tr *ngIf="logs.length === 0">
          <td colspan="6" style="text-align: center;">No audit log records found yet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
